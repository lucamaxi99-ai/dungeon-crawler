<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Dungeon Crawler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <canvas id="screen" width="320" height="200" aria-label="Game view"></canvas>
    <nav id="pad" aria-label="Controls">
      <button data-action="turnLeft" aria-label="Turn left">&#x21B6;</button>
      <button data-action="forward" aria-label="Forward">&#x25B2;</button>
      <button data-action="turnRight" aria-label="Turn right">&#x21B7;</button>
      <button data-action="interact" class="wide" aria-label="Use">USE</button>
      <button data-action="left" aria-label="Sidestep left">&#x25C0;</button>
      <button data-action="back" aria-label="Back">&#x25BC;</button>
      <button data-action="right" aria-label="Sidestep right">&#x25B6;</button>
      <button data-action="map" class="wide" aria-label="Map">MAP</button>
    </nav>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
